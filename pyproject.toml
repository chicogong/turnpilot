[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "turnpilot"
version = "0.1.0.dev1"
description = "Provider-neutral turn-taking decision and evaluation core for voice agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = []
keywords = ["voice", "turn-taking", "endpointing"]

[project.urls]
Repository = "https://github.com/chicogong/turnpilot"
Documentation = "https://github.com/chicogong/turnpilot/tree/main/docs"
Issues = "https://github.com/chicogong/turnpilot/issues"

[project.scripts]
turnpilot-eval = "turnpilot.manifest:main"
turnpilot-evidence-audit = "turnpilot.evidence:main"
turnpilot-action-replay = "turnpilot.action_trace:main"
turnpilot-file-run = "turnpilot.file_run:main"

[project.optional-dependencies]
jev = ["httpx>=0.27,<1"]
file = [
    "numpy>=1.26,<3",
    "onnxruntime>=1.19,<2",
    "vosk==0.3.42; sys_platform == 'darwin'",
    "vosk==0.3.45; sys_platform != 'darwin'",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.12,<1",
    "mypy>=1.15,<2",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/turnpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/turnpilot"]
